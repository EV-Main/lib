# A second palette for the kit's own tests and example: aquafix's brand.toml
# (Service-Arb), in its own file format, retuned where it misses the kit's floors
# and completed with the names the contract has grown since it was written.
#
# Changed from aquafix:
#   light primary-ink  (new)       #9a5424 — copper #c2703d reads 3.70:1 on white;
#                                  the darker step reads 5.73:1 (AA text)
#   light muted  #edf1f5 → #d2dbe6 — a slider track on card needs ~1.3:1, was 1.07
#   dark  primary-ink  (new)       #e08f5c — 6.11:1 on card (was 4.20 as copper)
#   chart-1 … chart-6  (new)       the accents, which are already distinguishable;
#                                  chart-6 is a violet the contract added in 1.0
#   light accent-warn  #e08a3c → #c57935 — warn is text in its own colour, and
#                                  read 2.35:1 on secondary; now 3.00:1
#   dark  accent-error #d8362a → #e05e55 — 2.48:1 on the destructive row's tint,
#                                  now 3.10:1; its label turns dark (white 3.56:1)
#   primary-hover  (new)           #c97a46 on both polarities — the contract's
#                                  darker step leaves the dark label at 4.46:1,
#                                  so the hover lightens instead (5.49:1)
#   the derived tokens (hover, ink-*, border, input, ring) are left to the
#   contract, so they follow this ink instead of being pinned by hand.

wordmark = ["AQUA", "FIX"] # read by other tools; the palette ignores it
mark = "/brands/aquafix-mark.svg"
mark-aspect = "86.6 / 100"

[colors.light]
background = "#ffffff"
card = "#f6f8fa"
muted = "#d2dbe6"
popover = "#ffffff"
ink = "#051726"
brand = "#0a2540"
primary = "#c2703d"
on-primary = "#051726"
primary-ink = "#9a5424"
primary-hover = "#c97a46"
secondary = "#edf1f5"
on-secondary = "#051726"
positive = "#1e9e6a"
on-positive = "#ffffff"
accent-trace = "#5a6b7c"
on-accent-trace = "#ffffff"
accent-debug = "#5a6b7c"
on-accent-debug = "#ffffff"
accent-info = "#5a6b7c"
on-accent-info = "#ffffff"
accent-warn = "#c57935"
on-accent-warn = "#051726"
accent-error = "#d8362a"
on-accent-error = "#ffffff"
chart-1 = "#9a5424"
chart-2 = "#1e9e6a"
chart-3 = "#e08a3c"
chart-4 = "#d8362a"
chart-5 = "#0a2540"
chart-6 = "#6d5acc"

[colors.dark]
background = "#051726"
card = "#0a2540"
muted = "#12395c"
popover = "#12395c"
ink = "#ffffff"
brand = "#0a2540"
primary = "#c2703d"
on-primary = "#051726"
primary-ink = "#e08f5c"
primary-hover = "#c97a46"
secondary = "#12395c"
on-secondary = "#ffffff"
positive = "#1e9e6a"
on-positive = "#ffffff"
accent-trace = "#a9bdd1"
