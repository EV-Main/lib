# Hand-written (not generated by the v_flakes `github` module). A PR that moves
# a visual baseline gets `nix run .#visual-review` against its base: the
# changed-% table as the job summary and one sticky comment, the HTML page as
# the `visual-review` artifact. It reads committed baselines only, so it builds
# nothing; the gallery test in uikit-rust.yml is what holds them to the render.
name: Visual review
'on':
  pull_request:
    paths:
      - rust/tests/visual/__screenshots__/**
      - scripts/visual-review.*
      - .github/workflows/visual-review.yml
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    name: visual review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Review
        run: nix run .#visual-review -- --summary tmp/visual-review.md "origin/${{ github.base_ref }}"
      - name: Upload page
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: tmp/visual-review.html
          if-no-files-found: error
          retention-days: 14
      - name: Summary and comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PAGE: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Visual review vs \`${{ github.base_ref }}\`"
            echo "[Page]($PAGE): download, unzip, open the HTML. Same as \`nix run .#visual-review\` locally."
            echo
            cat tmp/visual-review.md
          } > tmp/comment.md
          cat tmp/comment.md >> "$GITHUB_STEP_SUMMARY"
          # one comment per PR, rewritten on every push
          gh pr comment "$PR" --edit-last --body-file tmp/comment.md || gh pr comment "$PR" --body-file tmp/comment.md
