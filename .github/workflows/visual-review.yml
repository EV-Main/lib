# Hand-written (not generated by the v_flakes `github` module). A PR whose
# baselines differ from its base gets `nix run .#visual-review` hosted at
# https://ev-main.github.io/web_std/pr/<n>/ and one comment linking it with the
# changed-% table; no difference, no page and no comment. Closing the PR takes
# the page down. It reads committed baselines only, so it builds nothing; the
# gallery test in uikit-rust.yml is what holds them to the render.
name: Visual review
'on':
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - rust/tests/visual/__screenshots__/**
      - scripts/visual-review*
      - .github/workflows/visual-review.yml
permissions:
  contents: write
  pull-requests: write
# every run rewrites the one gh-pages commit
concurrency:
  group: visual-review-pages
  cancel-in-progress: false
env:
  PR: ${{ github.event.pull_request.number }}
  GH_TOKEN: ${{ github.token }}
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
jobs:
  review:
    name: visual review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        if: github.event.action != 'closed'
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Review
        if: github.event.action != 'closed'
        run: nix run .#visual-review -- --summary tmp/visual-review.md "origin/${{ github.base_ref }}"
      - name: Publish
        run: |
          marker='<!-- visual-review -->'
          previous=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [[ ${{ github.event.action }} == closed ]] || grep -q '^0 changed' tmp/visual-review.md; then
            scripts/visual-review-pages.sh "$PR"
            [[ -z $previous ]] || gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$previous"
            exit 0
          fi
          scripts/visual-review-pages.sh "$PR" tmp/visual-review.html
          {
            echo "$marker"
            echo "### [Visual review vs \`${{ github.base_ref }}\`](https://ev-main.github.io/web_std/pr/$PR/)"
            echo
            cat tmp/visual-review.md
          } > tmp/comment.md
          cat tmp/comment.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -n $previous ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$previous" -F body=@tmp/comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file tmp/comment.md
          fi
