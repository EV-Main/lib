# Hand-written (not generated by the v_flakes `github` module): renders the
# visual baselines on the same ubuntu image the gallery test in uikit-rust.yml uses and
# publishes them as the `visual-snapshots` artifact, so a dev without a linux
# builder can refresh `rust/tests/visual/__screenshots__/` honestly:
#
#   rm -f rust/tests/visual/__screenshots__/*.png
#   gh run download <run-id> -n visual-snapshots -D rust/tests/visual/__screenshots__
#
# The gallery test in uikit-rust.yml stays the arbiter; this job only produces the PNGs.
name: Visual baselines
'on':
  pull_request:
    paths:
      - rust/**
      - tokens.css
      - theme.css
      - ev.css
      - motion.css
      - flake.nix
      - flake.lock
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  render:
    name: render baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Paths built here rather than substituted (the rust-overlay toolchain, google-fonts) go to a
      # file:// binary cache kept across runs: v_flakes' github/cache.nix `lean` scheme, keyed on the closure.
      # Saved by uikit-rust's main runs only.
      - name: Lean nix cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
      - name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/nix-lean-cache
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-keys: nix-lean-${{ runner.os }}-
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      # rust-cache reads the toolchain off PATH; the runner's own rustup one would key it wrong
      - name: Toolchain on PATH
        run: |
          nix develop --command bash -c 'dirname "$(command -v rustc)" > /tmp/rust-bin'
          cat /tmp/rust-bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: uikit
          save-if: false # only uikit-rust's main runs save; this job reads that cache
      - name: Render
        run: nix develop --command env RUSTC_WRAPPER= UPDATE_EXPECT=1 cargo test -p ev_lib --features uikit_dioxus --test gallery
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: rust/tests/visual/__screenshots__/*.png
          if-no-files-found: error
          retention-days: 14
