# Hand-written (not generated by the v_flakes `github` module, whose default
# job set is off here): the Rust side of the uikit — the class tables, the
# Dioxus components' tests, and the codegen that turns the one into the TS
# port's `generated/` modules. None of it ran in CI before, so a red test sat on
# main unseen (uikit::select, 3801a5d → #164) and a hand-edited or stale
# generated file would pass review.
name: uikit rust
'on':
  pull_request:
    paths:
      - rust/**
      - ts/uikit/src/generated/**
      - ts/i18n/src/generated/**
      - ts/types/src/generated/**
      - tokens.css
      - theme.css
      - ev.css
      - motion.css
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - flake.nix
      - flake.lock
      - .github/workflows/uikit-rust.yml
  push:
    branches: [main]
    paths:
      - rust/**
      - ts/uikit/src/generated/**
      - ts/i18n/src/generated/**
      - ts/types/src/generated/**
      - tokens.css
      - theme.css
      - ev.css
      - motion.css
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - flake.nix
      - flake.lock
      - .github/workflows/uikit-rust.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: classes, components, codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/nix-env
        with: { rust-cache: uikit }
      - name: ev_lib_classes
        run: nix develop --command cargo test -p ev_lib_classes
      # Both ports at once: the parity test renders every gallery entry through each.
      # The gallery itself is visual-baselines.yml's.
      - name: ev_lib uikit
        run: nix develop --command cargo test -p ev_lib --features "uikit_dioxus uikit_leptos" -- --exact --skip matches_baselines
      # The generated files are committed, so a change to their source that was
      # not regenerated (or an edit to the output by hand) shows up as a diff.
      # `gen` brings rustc but not a linker, so it runs from the dev shell (as the
      # pre-commit hook does). Scoped to what `gen` writes: entering the dev shell
      # rewrites README.md and friends, which is the flake's business, not this
      # check's.
      - name: Codegen drift
        run: |
          nix develop --command nix run .#gen
          out="rust/classes/css rust/classes/uikit-classes.txt ts/uikit/src/generated ts/uikit/styles ts/i18n/src/generated ts/types/src/generated"
          drift="$(git status --porcelain -- $out)"
          if [ -n "$drift" ]; then
            echo "::error::generated files are stale — run \`nix run .#gen\` and commit the result"
            echo "$drift"
            git diff -- $out
            exit 1
          fi
