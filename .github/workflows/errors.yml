env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: ""
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  js-tests:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          cache-dependency-path: ts/*/package-lock.json
          node-version: "24"
      - name: Run tests
        run: |
          build_file_deps() {
          node -e '
            const p = require("./package.json");
            for (const deps of [p.dependencies, p.devDependencies, p.peerDependencies])
              for (const v of Object.values(deps ?? {}))
                if (v.startsWith("file:")) console.log(v.slice(5));
          ' | while read -r dep; do
            (cd "$dep" && npm ci --ignore-scripts && npm run build) || exit 1
          done
          }
          shopt -s nullglob
          ran=0
          failed=()
          for manifest in ts/*/package.json; do
            node -e 'process.exit(require(process.argv[1]).scripts?.test ? 0 : 1)' "$PWD/$manifest" || continue
            dir="$(dirname "$manifest")"
            ran=$((ran + 1))
            echo "::group::$dir"
            (cd "$dir" && build_file_deps && npm ci && npm test) || failed+=("$dir")
            echo "::endgroup::"
          done
          [ "$ran" -gt 0 ] || { echo "::error::no package under ts/ has a \`test\` script"; exit 1; }
          for dir in "${failed[@]}"; do echo "::error::$dir: npm test failed"; done
          [ ${#failed[@]} -eq 0 ]
    timeout-minutes: 30
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
name: Errors
on:
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
