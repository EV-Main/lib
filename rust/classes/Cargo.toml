[package]
name = "ev_lib_classes"
version = "0.19.0"
edition = "2024"
description = "Pure styling data (Tailwind class tables) shared by the Dioxus uikit and the TS codegen — no Dioxus."
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Main/web_std"

[features]
# Serde derives on the data `ev_lib_gen` emits to TS; nothing else enables it.
ts_gen = ["dep:serde", "dep:ts-rs"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
strum.workspace = true
tailwind_fuse = { workspace = true, features = ["variant"] }
ts-rs = { workspace = true, optional = true }
